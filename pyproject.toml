[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rogii-geo"
version = "0.1.0"
description = "Reusable feature engineering and prediction helpers for Rogii wellbore geology TVT prediction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "xgboost",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pydantic",
  "pydantic-settings",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["rogii_geo*", "app*"]
exclude = ["tests*", "notebooks*", "artifacts*", "results*", "predictions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
